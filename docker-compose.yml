services:
  redis:
    image: redis:8.6.0-alpine
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: tide
      POSTGRES_PASSWORD: tide
      POSTGRES_DB: tide_test
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tide"]
      interval: 5s
      timeout: 3s
      retries: 5
